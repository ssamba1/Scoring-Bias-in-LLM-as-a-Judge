name: numbers-match

# Reproducibility gate: rerun every analysis script on the committed raw data
# and fail if any derived number, table, or JSON differs from what is committed.
# This is the mechanical form of the paper's reproducibility claim.

on:
  push:
    branches: [honest-rewrite, main]
  pull_request:

# A run takes minutes -- the mutation pass alone re-runs a test file per
# registered mutation -- so a burst of commits queues faster than the runners
# drain it, and the result is a backlog where nothing reports on anything. Only
# the newest commit on a branch needs a verdict: superseded runs are cancelled
# so the queue always drains to what HEAD actually is.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nothing fabricated may be on display, and no credential may be in the
  # history. Both are checked here because both have actually gone wrong in this
  # repository, and neither was covered by any automated check until now: the
  # test suite had never run in CI at all.
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scan reads every commit. actions/checkout defaults to
          # depth 1, and a scan of one commit reports clean forever -- which is
          # worse than no scan, because it is believed. scan_secrets.py refuses
          # a shallow clone rather than pass one, so this must be 0.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest
      - name: No fabricated artefact outside RETRACTED/, submission intact
        run: python -m pytest tests/ -q -rs
      - name: The guards must be able to fail
        run: python mutation_check.py
      - name: No credential anywhere in the history
        run: python scan_secrets.py
      - name: Paper prose must match the committed derived results
        # Also run in regenerate-and-diff, against freshly regenerated JSON.
        # Here it runs against the committed JSON with no analysis stack
        # installed, so prose drift is caught even when that job is skipped or
        # its dependency install fails. check_prose.py is stdlib-only.
        working-directory: paper/honest/repro
        run: python check_prose.py

  # Does the thing we would actually submit compile? Nothing here checked that.
  # The integrity job verifies the archive's digests match the sources and that
  # its build log shows a clean run -- but the log is not tracked, so on a fresh
  # checkout those assertions skipped, and a skip reads as a pass. The paper
  # built cleanly only on my machine. arXiv compiles from the tarball.
  submission-compiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install a minimal TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science
      - name: Compile the archive exactly as arXiv would
        # From the tarball, not the working tree: arXiv gets the tarball, and a
        # paper that builds in the repository but not in the archive is the
        # failure this is here to catch. arXiv does not run BibTeX, so the
        # bundled .bbl is what supplies the bibliography.
        run: |
          set -e
          mkdir -p /tmp/arxiv && tar xzf paper/honest/arxiv_submission.tar.gz -C /tmp/arxiv
          cd /tmp/arxiv
          test -f main.bbl || { echo "no .bbl in the archive; arXiv would render no references"; exit 1; }
          pdflatex -interaction=nonstopmode -halt-on-error main.tex > pass1.log
          pdflatex -interaction=nonstopmode -halt-on-error main.tex > pass2.log
          test -f main.pdf || { echo "no PDF produced"; exit 1; }
      - name: The build must be clean
        run: |
          cd /tmp/arxiv
          undefined=$(grep -c "Citation.*undefined\|Reference.*undefined" pass2.log || true)
          overfull=$(grep -c "Overfull \\\\hbox" pass2.log || true)
          missing=$(grep -c "File .* not found" pass2.log || true)
          echo "undefined=$undefined overfull=$overfull missing=$missing"
          test "$undefined" -eq 0 || { grep -n "undefined" pass2.log | head -20; exit 1; }
          test "$missing" -eq 0 || { grep -n "not found" pass2.log | head -20; exit 1; }
          test "$overfull" -eq 0 || { grep -n "Overfull" pass2.log | head -20; exit 1; }

  regenerate-and-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned analysis stack
        run: pip install -r paper/honest/repro/requirements-repro.txt
      - name: Regenerate all derived results from committed raw data
        working-directory: paper/honest/repro
        run: |
          python analyze_peritem.py
          python analyze_mechanism.py
          python analyze_gold.py
          python analyze_robustness.py
          python analyze_stages.py
          python analyze_newprobes.py results_probes2.json
          python analyze_newprobes.py results_zh.json
          python analyze_newprobes.py results_14b.json
          python analyze_spanpatch.py
          python analyze_dose.py
          python analyze_gran.py
          python analyze_chat.py
          python analyze_sampled.py
          python analyze_t10.py
          python analyze_tokvar.py
          python analyze_closed.py
      - name: Committed figures must show what the current data produces
        # Content, not bytes: a PDF embeds a creation timestamp, so regenerating
        # always changes the bytes. This compares the text drawn into each figure
        # and its geometry, which is stack-independent -- unlike a raster
        # comparison, which lapses exactly when someone changes environment.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          python check_figures.py
        working-directory: paper/honest/repro
      - name: Paper prose numbers must match derived results
        working-directory: paper/honest/repro
        run: python check_prose.py
      - name: Derived outputs must match committed versions
        run: |
          git diff --exit-code -- \
            paper/honest/repro/results_peritem.json \
            paper/honest/repro/results_mechanism.json \
            paper/honest/repro/results_gold.json \
            paper/honest/repro/results_robustness.json \
            paper/honest/repro/results_stages_analysis.json \
            paper/honest/repro/results_probes2_analysis.json \
            paper/honest/repro/results_zh_analysis.json \
            paper/honest/repro/results_14b_analysis.json \
            paper/honest/repro/spanpatch_analysis.json \
            paper/honest/repro/results_dose_analysis.json \
            paper/honest/repro/results_gran_analysis.json \
            paper/honest/repro/results_chat_analysis.json \
            paper/honest/repro/results_sampled_analysis.json \
            paper/honest/repro/results_t10_analysis.json \
            paper/honest/repro/results_tokvar_analysis.json \
            paper/honest/repro/results_closed_analysis.json \
            paper/honest/tables/
