[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scoring-bias-llm-as-judge"
version = "1.0.0"
description = "Where Does Scoring Bias Come From? A Base vs Instruct Comparison of LLM-as-a-Judge"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Sricharan Samba"},
]
keywords = ["llm-as-a-judge", "scoring-bias", "evaluation", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "pydantic>=2.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=7.1",
    "flake8>=7.2",
    "black>=24.10",
]
# The api and dashboard extras are gone with the scripts that needed them:
# both served the fabrication-era synthetic datasets and are quarantined under
# RETRACTED/legacy/scripts/. Installing fastapi and streamlit to run nothing is
# how a dead surface keeps looking maintained.
notebook = [
    "jupyter>=1.1",
    "jupytext>=1.16",
]
all = [
    "scoring-bias-llm-as-judge[dev,notebook]",
]

[project.urls]
Homepage = "https://github.com/ssamba1/Scoring-Bias-in-LLM-as-a-Judge"
Repository = "https://github.com/ssamba1/Scoring-Bias-in-LLM-as-a-Judge"
Documentation = "https://github.com/ssamba1/Scoring-Bias-in-LLM-as-a-Judge"

# No console script and no packaged module. `scoring-bias = "cli:main"` pointed
# at cli.py, which imported a scoring_bias package that has no tracked files --
# so `pip install .` produced a command that failed on import, and
# packages.find pointed at src/, which does not exist in a clean clone.
#
# This repository is a paper and its reproduction, not a library. The entry
# points that matter are run_all.sh, verify_like_ci.py and mutation_check.py.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --no-header"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", "build", "dist", "*.egg-info"]

[tool.coverage.run]
# All three of the old sources are gone: src/ and scripts/ have no tracked
# files and cli.py is quarantined. Coverage over the code this project actually
# runs is the analysis pipeline and the two verification tools.
source = ["paper/honest/repro", "mutation_check.py", "verify_like_ci.py"]
omit = ["tests/*"]
