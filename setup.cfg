[flake8]
max-line-length = 100

# E203 is whitespace before ':'. Every instance here is a slice written as
# text[a : b], which is what black produces; flake8 and black disagree about
# it and black wins, because black is the formatter. This is the standard
# resolution, not an exemption for this project's convenience.
extend-ignore = E203

per-file-ignores =
    # mutation_check.py stores the exact bytes each mutation looks for: a LaTeX
    # table row, a docker-compose command, a CITATION title line. Those strings
    # have to match the file they are checked against, character for character.
    # Wrapping them to satisfy a line-length rule would silently stop the
    # mutation from applying -- the harness would report it as never having run,
    # which is the failure this file exists to prevent.
    mutation_check.py: E501
